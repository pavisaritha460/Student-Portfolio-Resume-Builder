<!DOCTYPE html>
<html>
<head>
    <title>My Portfolio</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="container">

        <div id="portfolio"></div>

        <br>

        <a href="dashboard.html">Back to Dashboard</a>

    </div>

    <script>
        const user = JSON.parse(localStorage.getItem("user"));

        if (!user) {
            window.location.href = "login.html";
        }

        async function loadPortfolio() {
            const response = await fetch("http://localhost:5000/api/portfolio/" + user.id);
            const data = await response.json();

            let skillsHTML = "";

            data.skills.forEach(skill => {
                skillsHTML += `
                    <li>${skill.skillName} - ${skill.level}</li>
                `;
            });

            let projectsHTML = "";

            data.projects.forEach(project => {
                projectsHTML += `
                    <div>
                        <h3>${project.title}</h3>
                        <p>${project.description}</p>
                        <p><strong>Technologies:</strong> ${project.technologies}</p>
                        <a href="${project.githubLink}" target="_blank">
                            View Project
                        </a>
                    </div>
                `;
            });

            let certificationsHTML = "";

            data.certifications.forEach(certificate => {
                certificationsHTML += `
                    <div>
                        <h3>${certificate.certificateName}</h3>
                        <p>${certificate.organization}</p>
                        <a href="${certificate.certificateLink}" target="_blank">
                            View Certificate
                        </a>
                    </div>
                `;
            });

            let educationHTML = "";

            data.education.forEach(education => {
                educationHTML += `
                    <div>
                        <h3>${education.degree}</h3>
                        <p>${education.college}</p>
                        <p>${education.department}</p>
                        <p>CGPA: ${education.cgpa} | Year: ${education.year}</p>
                    </div>
                `;
            });

            document.getElementById("portfolio").innerHTML = `
                <h1>${data.name}</h1>

                <p>${data.email}</p>

                <hr>

                <h2>About Me</h2>
                <p>
                    ${data.profile ? data.profile.objective : ""}
                </p>

                <h2>Education</h2>
                ${educationHTML}

                <h2>Skills</h2>
                <ul>
                    ${skillsHTML}
                </ul>

                <h2>Projects</h2>
                ${projectsHTML}

                <h2>Certifications</h2>
                ${certificationsHTML}
            `;
        }

        loadPortfolio();
    </script>

</body>
</html>
